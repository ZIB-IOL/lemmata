abstract: >-
  We prove that every tensor $T\in(\mathbb C^n)^{\otimes k}$, for $k\ge2$, has asymptotic rank at most $n^{k/2}$, improving the upper bound $n^{3(k-1)/4}$ for $k\ge4$. The bound is sharp for every even $k$, with equality whenever a balanced flattening is nonsingular. Our proof extends the shared-leg separation technique from OpenAI’s $\omega\le9/4$ matrix multiplication bound to the multipartite setting. For complete-graph tensors, we prove that the asymptotic rank exponent per edge satisfies $\tau(K_k)\le k/[2(k-1)]$, with equality for even $k$.
ai_use: The exposition and Lean formalization were developed with OpenAI Codex.
