schema_version: 1
id: frank-wolfe-open-loop-acceleration
lean_namespace: Lemmata.FWOpenLoop
subject: math.OC
cross_lists: [cs.LG]
topics: [frank-wolfe]
arxiv: "2205.12838"
note: >-
  Formalizes Sections 3 to 5 of @wirth2022acceleration.
abstract: >-
  The Frank–Wolfe algorithm with the open-loop step sizes $\eta_t = 4/(t + 4)$ converges at the
  rate $8L\delta^2/(t + 3)$, and faster when the primal gaps obey the recursion
  $h_{t+1} \le (1 - \eta_t/2) h_t - \eta_t A C_t h_t^{1-\psi} + \eta_t^2 B C_t$: a sequence lemma
  then gives rates up to $O(1/t^2)$. Scaling inequalities, lower bounds on the Frank–Wolfe gap in
  terms of the primal gap, give such recursions when the minimizers lie in the relative interior and
  a Hölderian error bound holds, when the gradients are bounded away from zero on a uniformly convex
  set, and under a Hölderian error bound on a uniformly convex set. The statements hold in real
  normed spaces, for every Frank–Wolfe run; the scaling inequality in the relative interior is
  corrected for feasible regions that are not full-dimensional. Decomposition-invariant pairwise
  Frank–Wolfe with the step sizes $8/(t + 8)$, rounded down to powers of $1/2$, and away-step
  Frank–Wolfe with open-loop step sizes and a count of progress steps reach rates up to $O(1/t^2)$
  under a Hölderian error bound on polytopes. For a strongly convex objective whose minimizer lies in
  the relative interior of a face of a polytope, with strict complementarity, the atoms identify
  the face and Frank–Wolfe with open-loop step sizes converges at the rate $O(1/t^2)$.
