schema_version: 1
id: distributional-linear-oracle-lower-bounds
lean_namespace: Lemmata.DistributionalLowerBounds
category: optimization
arxiv: "2610.13590"
abstract: >-
  A uniform prior over a permuted family of strongly convex feasible sets gives
  an expected objective-error lower bound of order $L D^2/(T+1)^2$ after at most $T$
  exact linear-oracle calls, even for randomized methods with arbitrary query
  directions. The gap is at least the same threshold with probability at least
  $3/4$. The dimension grows with
  the query budget, and every returned output must be feasible on every instance
  and seed. Fixed-instance and first-return stopping-time consequences are included.
