abstract: >-
  We present a method for proving lower bounds on the distance from a Boolean polynomial of degree $m-3$ in $m$ variables to the space of lower-degree polynomials by reducing the problem to affine MinRank. Applying this method, we prove lower bounds of $32$, $32$, and $34$ for the relative covering radius of $\mathrm{RM}(m-4,m)$ in $\mathrm{RM}(m-3,m)$ for $m=9,10,11$, respectively. Together with known upper bounds, these determine the relative covering radii of $\mathrm{RM}(5,9)$ in $\mathrm{RM}(6,9)$ and of $\mathrm{RM}(6,10)$ in $\mathrm{RM}(7,10)$ to be $32$. The three consecutive examples, combined with a three-variable extension, also give the constructive bound $\rho(\mathrm{RM}(m-4,m),\mathrm{RM}(m-3,m))\ge2m+12$ for every $m\ge9$, improving the earlier bound $2m+10$.
