schema_version: 1
id: schrodinger-remainder-bound
lean_namespace: Lemmata.SchrodingerRemainderBound
subject: math-ph
abstract: >-
  For positive mass and real momentum, the positive relativistic kinetic
  energy after removal of the rest energy decomposes exactly into the
  Schrödinger kinetic term and an explicit correction whose magnitude is
  bounded by the fourth power of momentum divided by eight times the cube of
  the mass.
contributors:
  - G. D. Partin
