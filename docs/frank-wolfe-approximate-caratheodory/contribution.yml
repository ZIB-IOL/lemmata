id: frank-wolfe-approximate-caratheodory
lean_namespace: Lemmata.FWCaratheodory
subject: math.OC
cross_lists: [cs.DS, cs.LG]
topics: [frank-wolfe]
arxiv: "1911.04415"
abstract: >-
  The approximate Carathéodory problem asks for a convex combination of few points of a set that
  approximates a given point of its convex hull. The Frank–Wolfe algorithm applied to
  $\frac{1}{2}\|x - x^\star\|_p^2$ adds at most one point per iteration, so its convergence rates
  bound the number of points. For $p \ge 2$ the objective is differentiable, convex,
  $(p - 1)$-smooth with a $(p - 1)$-Lipschitz gradient, $1$-gradient dominated and $\sqrt{2}$-sharp
  with respect to the $\ell_p$-norm. Approximating the barycenter of the normalized columns of a
  Hadamard matrix of order $n$ to accuracy $\varepsilon$ needs at least $1/(\varepsilon^2 + 1/n)$
  columns.
