schema_version: 1
id: objective-reversal
lean_namespace: Lemmata.ObjectiveReversal
category: optimization
abstract: >-
  An instance-independent completion transfers a maximization optimum to the
  minimum of a reversed objective. At approximation factor $1+1/(4N)$, a source
  slack margin of $1/4$ gives a nonnegative row correction and transfers
  nonnegative-rank lower bounds with at most one additional factor. The
  combinatorial reduction and the source lower bound are explicit hypotheses.
ai_use: >-
  Lean formalization and exposition prepared with OpenAI Codex. Source
  nonnegative-rank lower bounds and application-specific combinatorial maps
  remain explicit hypotheses.
