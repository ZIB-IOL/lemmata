arxiv: "2211.14103"
abstract: >-
  Variants of the Frank–Wolfe algorithm from Chapter 3 of the book Conditional Gradient Methods,
  starting with adaptive step sizes (AdaFW, Section 3.1.2). The adaptive strategy keeps an estimate
  $M$ of the smoothness constant, takes the short step for $M$ and increases $M$ by a factor
  $\tau > 1$ until a sufficient decrease test passes. For an $L$-smooth objective the test passes
  as soon as $M \ge L$, so the search stops after at most $\lceil \log_\tau (L/M_0) \rceil$ increases
  with an estimate at most $\max\{M_0, \tau L\}$, and Frank–Wolfe with these steps keeps the rates
  $2KD^2/(t+3)$ for the primal gap and $4KD^2/(t+3)$ for the smallest Frank–Wolfe gap, with $K$
  the largest estimate used. The statements hold in real normed spaces.
