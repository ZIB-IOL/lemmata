schema_version: 1
id: formulation-reduction
lean_namespace: Lemmata.FormulationReduction
category: optimization
arxiv: [1410.8816, 1512.04932]
abstract: >-
  Explicit nonnegative affine certificates for a linear programming formulation
  yield a factorization of its slack matrix with at most one more factor than
  the number of inequalities. Composing this construction with a nonnegative
  multiplier and remainder transfers source rank lower bounds to the number of
  formulation inequalities. Positive-cost and bounded-baseline corollaries make
  the source rank assumption explicit.
ai_use: >-
  Lean formalization and exposition prepared with OpenAI Codex; external
  lower-bound theorems are explicit hypotheses.
