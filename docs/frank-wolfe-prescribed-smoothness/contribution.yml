schema_version: 1
id: frank-wolfe-prescribed-smoothness
lean_namespace: Lemmata.FrankWolfePS
subject: math.OC
cross_lists: [cs.LG]
topics: [frank-wolfe]
abstract: >-
  For every $T \ge 0$, $\beta > 0$ and $D > 2/\beta$, and every randomized method requiring no
  more than $T$ calls to a linear minimization oracle, there is a convex body with $\beta$-Lipschitz
  unit normals, diameter at most $D$ and exactly one linear minimizer in every nonzero direction
  on which, with probability at least $1/5$, the method returns an infeasible point or a point
  with primal gap at least $L(D-2/\beta)^2/(64(T+1))$ for a known $L$-smooth and $L$-strongly
  convex quadratic. For methods with feasible outputs the probability is $3/4$. Frank–Wolfe on
  the inner parallel body reaches primal gap $2L(D-2/\beta)^2/(T+1)$ on every such body, so the
  order $L(D-2/\beta)^2/T$ is optimal. The entry also proves lower bounds for an oracle that breaks
  ties by index, including deterministic methods in dimension $64(T+1)+1$ and a penalty for
  infeasible outputs, an upper bound for general smooth convex objectives by conditional gradient
  sliding, and a linear rate for bodies with inner and outer tangent balls.
