schema_version: 1
id: frank-wolfe-prescribed-smoothness
lean_namespace: Lemmata.FrankWolfePS
subject: math.OC
cross_lists: [cs.LG]
topics: [frank-wolfe]
abstract: >-
  For every $T$, smoothness $\beta > 0$ and diameter $D > 2/\beta$, every randomized method
  requiring no more than $T$ calls to an exact linear minimization oracle, with arbitrary query
  directions and full knowledge of the objective, fails on some compact convex body with
  $\beta$-Lipschitz unit normals, diameter at most $D$ and a unique minimizer in every nonzero
  direction: with probability at least $1/5$ it returns an infeasible point or a point with gap at
  least $L(D-2/\beta)^2/(64(T+1))$ for an $L$-smooth and $L$-strongly convex quadratic. The
  dimension grows with $T$. For methods that always return feasible points the probability is
  $3/4$, with expected gap of the same order. A method requiring no more than $T$ oracle calls
  reaches gap
  $2L(D-2/\beta)^2/(T+1)$ on every such body, so the order $L(D-2/\beta)^2/T$ is attained. With a
  fixed vertex tie rule the regular hard family gives the bound with diameter exactly $D$,
  probability $1/4$ and constant $32$; it defeats deterministic methods already in dimension
  $64(T+1)+1$, and a distance penalty gives the same order for arbitrary outputs. The family is
  exactly $\beta$-smooth, not uniformly convex, and fails local dual sharpness at its optimum. For general smooth convex objectives a sliding
  method needs $n$ gradients and $O(n + (D-2/\beta)^2 n^2/D^2)$ oracle calls for gap
  $O(LD^2/n^2)$, and bodies with inner and outer tangent balls admit a linear rate with one oracle
  call and one gradient per iteration.
