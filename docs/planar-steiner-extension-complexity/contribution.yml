topics: [extended-formulations]
contributors:
  - {name: Sebastian Pokutta, orcid: 0000-0001-7365-3000}
abstract: >-
  The convex hull of the inclusion-minimal Steiner trees of a simple planar graph has
  worst-case linear extension complexity $2^{\Theta(\sqrt n)}$, where $n$ is the number of
  vertices, already for two cofacial terminals; the same holds for the hull of connected
  supports, the hull of terminal-connecting edge sets and the Steiner tree dominant. The lower
  bound starts from the correlation polytope of the $h\times h$ grid, encodes vertex covers in a
  plane cover graph, and makes each cover the shore of a bond of a planar triangulation whose dual
  edges form a Hamiltonian cycle; a sphere-cut dynamic program gives the matching upper bound. The Lean
  formalization proves the complete reduction chain on explicit graphs: their planarity, as face
  systems satisfying Euler's formula, the exact vertex counts $832h(h-1)$ and $104h(h-1)+2$, and
  the resulting lower bounds $2^{\Omega(\sqrt n)}$ given the exponential lower bound for grid
  correlation polytopes of Aboulker, Fiorini, Huynh, Macchia and Seif. That external bound and
  the upper bound remain outside Lean.
ai_use: >-
  The Lean formalization and this entry (prose adapted from the paper, figures) were developed
  with Claude (Anthropic) through the pi coding agent; the underlying paper's exposition was
  developed with OpenAI Codex. The exponential lower bound for grid correlation polytopes enters
  the lower bounds as an explicit hypothesis, and the sphere-cut upper bound, the identity
  $P_{\uparrow}=D\cap[0,1]^E$, the planarity of the pendant graphs, and the results on terminal
  parameters, facets and special cases are not formalized. No custom axioms are introduced.
acknowledgements: >-
