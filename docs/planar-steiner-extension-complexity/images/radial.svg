<svg role="img" aria-labelledby="radial-title radial-description" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" width="313.3" height="163.66" viewBox="0 0 313.3 163.66">
<title id="radial-title">The radial graph H of a small plane graph J</title><desc id="radial-description">J has vertices a, b, c, d, the four sides of a square and the chord ac. H subdivides each edge of J by a black edge terminal and adds a grey face terminal in each of the three faces of J, joined to the vertices on its boundary. The vertex cover S = {a, c} of J is drawn in black, b and d in grey; the thick blue edges form the connected induced subgraph H on the terminals together with S.</desc>
