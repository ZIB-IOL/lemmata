topics: [frank-wolfe]
arxiv: "2505.09886"
abstract: >-
  Convergence rates for the Frank–Wolfe algorithm with adaptive open-loop step sizes
  $\eta_t = g(t)/(t + g(t))$, where $g \ge 2$ is nondecreasing and the step sizes are
  nonincreasing. A cumulative-product bound for these step sizes, corrected to the range in which it
  holds, gives rates under the strong and weak growth properties of the affine-invariant analysis.
  For the log-adaptive step sizes $g(t) = 2 + \log(t + 1)$, the best duality gap converges at the
  rate $\tilde O(t^{-1/(1-r)})$ under strong $(M, r)$-growth and the primal gap at the rate
  $\tilde O(t^{-1/(1-r)} + t^{-2})$ under weak growth, with explicit constants. The statements hold
  in real normed spaces, for every Frank–Wolfe run.
