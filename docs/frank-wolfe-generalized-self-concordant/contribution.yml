schema_version: 1
id: frank-wolfe-generalized-self-concordant
lean_namespace: Lemmata.FWSelfConcordant
subject: math.OC
cross_lists: [cs.LG]
topics: [frank-wolfe]
arxiv: "2105.13913"
note: >-
  Formalizes Algorithm 1 and Theorems 2.4, 2.6, 2.11, 2.15 and 2.16, and Theorem 3.2 for
  away-step Frank–Wolfe, of @carderera2021simple.
abstract: >-
  Monotonic Frank–Wolfe with the simple step size $2/(t + 2)$ rejects a step whenever it leaves the
  domain of the objective or increases it. For generalized self-concordant objectives, which need
  not be globally smooth and may have a restricted domain, it converges at the rate $O(1/t)$ in the
  primal gap after a burn-in phase, and the smallest Frank–Wolfe gap converges at the rate
  $O(1/t)$. With the backtracking line search of Pedregosa et al., the rate is linear for an
  interior minimizer and improves over uniformly convex sets; over polytopes, away-step
  Frank–Wolfe with backtracking converges linearly. The formal statements assume the local
  properties that generalized self-concordance provides on the sublevel set of the starting
  point, a descent property along Frank–Wolfe segments or strong convexity, in real normed
  spaces.
