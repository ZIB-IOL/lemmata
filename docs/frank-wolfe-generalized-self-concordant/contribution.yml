schema_version: 1
id: frank-wolfe-generalized-self-concordant
lean_namespace: Lemmata.FWSelfConcordant
subject: math.OC
cross_lists: [cs.LG]
topics: [frank-wolfe]
arxiv: "2105.13913"
abstract: >-
  Monotonic Frank–Wolfe with the simple step size $2/(t + 2)$ rejects a step whenever it leaves the
  domain of the objective or increases it. For generalized self-concordant objectives, which need
  not be globally smooth and may have a restricted domain, it converges at the rate $O(1/t)$ in the
  primal gap after a burn-in phase, and the smallest Frank–Wolfe gap converges at the rate
  $O(1/t)$. The formal statements hold for every convex objective with the local descent property
  that generalized self-concordance provides along Frank–Wolfe segments from the sublevel set of
  the starting point, in real normed spaces.
