id: frank-wolfe-beyond-short-steps
lean_namespace: Lemmata.FrankWolfeBSS
subject: math.OC
cross_lists: [cs.LG]
topics: [frank-wolfe]
arxiv: "2501.18773"
note: >-
  Formalizes the primal-dual short steps of @martinezrubio2025beyond, without the optimistic
  Frank–Wolfe algorithm (Theorem 3.1) and the gradient descent variant (Proposition 4.2).
abstract: >-
  Primal-dual short steps for the Frank–Wolfe algorithm. The primal-dual gap
  $G_t = f(x_{t+1}) - L_t$, where $L_t$ is a weighted average of the Frank–Wolfe lower bounds
  $f(x_\ell) - \max_{v \in C} f'(x_\ell)(x_\ell - v)$ on the optimal value, is computable and
  bounds the primal gap, so it serves as a stopping criterion. It satisfies the exact recursion
  $G_t = (1-\gamma_t)G_{t-1} - \gamma_t f'(x_t)(v_t - x_t) - f(x_t) + f(x_t + \gamma_t(v_t - x_t))$,
  whose right-hand side is convex in the step size. Choosing every step size as the open-loop step,
  as the primal-dual short step $\min\{1, G_{t-1}/(L\|v_t - x_t\|^2)\}$, or by a line search on that
  right-hand side gives $G_t \le 2LD^2/(t+2)$ for a convex $L$-smooth objective on a compact convex
  set of diameter $D$. The same holds for heavy-ball Frank–Wolfe, whose lower bound minimizes the
  average of the linear models. The statements hold for every run in real normed spaces, for any
  tie-breaking of the oracle.
