abstract: >-
  We close the odd-order gap for complete-graph tensors using the exact rectangular matrix multiplication exponent. Grouping the vertices of $K_{2r+1}$ into blocks of sizes $r,r,1$ and projecting away internal edges gives a rectangular tensor with weights $r^2,r,r$, whose exponent is $r^2+r+1/4$. Combined with Kirill Khoruzhii's upper bound, this gives asymptotic rank $d^{k^2/4}$ and per-edge exponent $k/[2(k-1)]$ for every $k\ge2$ over every field. Lean proves the restriction and the implication from an explicitly stated external rectangular lower bound.
ai_use: The exposition and Lean formalization were developed with OpenAI Codex.
acknowledgements: This contribution uses Kirill Khoruzhii's complete-graph upper bound and tensor formalization from lemmata:2610.00005.
