schema_version: 1
id: information-diffusion-fano
lean_namespace: Lemmata.FanoDiffusion
subject: cs.IT
topics: [information-theoretic-lower-bounds]
arxiv: "1504.05492"
abstract: >-
  Fano's inequality bounds the probability of reconstructing a hidden random variable from
  observations by their mutual information. The information diffusion inequality behind it holds
  for any two probability distributions $P$ and $Q$ and any event $R$: if
  $p_{\min} \le Q(R) \le p_{\max}$ with $p_{\min} + p_{\max} < 1$, then
  $P(R) \le (D(P \| Q) + H(P(R)) + \log(1 - p_{\min}))/\log((1 - p_{\min})/p_{\max})$, where
  $H$ is the binary entropy. For a Markov chain $X \to Y \to \hat X$ and an arbitrary relation $R$
  of acceptable reconstructions, this gives a Fano inequality in terms of $I(X; \hat X) \le
  I(X; Y)$, which contains the distance-based and continuous Fano inequalities of Duchi and
  Wainwright as special cases. The statements hold for arbitrary measurable spaces.
