schema_version: 1
id: nonnegative-rank-reduction
lean_namespace: Lemmata.NonnegativeRankReduction
category: optimization
arxiv: [1410.8816, 1512.04932]
abstract: >-
  If a source matrix is the entrywise product of a nonnegative multiplier
  and a row-and-column restriction of a target matrix, plus a nonnegative
  remainder, then the corresponding factor counts satisfy the bound
  $a k+b$. We construct the factors, derive the nonnegative-rank inequality
  and lower-bound transfer, and prove invariance under transposition and
  strictly positive row scaling.
