subject: quant-ph
cross_lists: [math.OC]
topics: [bell-inequalities]
abstract: >-
  The symmetric full-correlation local Bell polytope for three parties and
  seventeen inputs has at least nineteen distinct extreme points, so it is not
  affinely equivalent to a nine-dimensional cross-polytope. Eighteen exposed
  frequency points and a mixed deterministic strategy with an exact separating
  inequality give a counterexample to the universal cross-polytope conjecture
  of Designolle, Vértesi and Pokutta.
