abstract: >-
  We transfer the exponential real PSD-rank bound for positively shifted matching matrices to constant-factor approximate SDP formulations of minimum-cost perfect matching, minimum-cost V-join, and minimum odd cut. The first two reductions use strictly positive metric costs and the third uses zero-one weights. No symmetry restriction is imposed. Lean proves the affine certificate construction and the finite reductions on concrete graph domains, with the external positive-shift PSD-rank bound as an explicit hypothesis.
ai_use: The exposition and Lean formalization were developed with OpenAI Codex.
