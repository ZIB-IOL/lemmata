schema_version: 1
id: frank-wolfe-local-dual-sharpness
lean_namespace: Lemmata.FrankWolfeLDS
subject: math.OC
cross_lists: [cs.LG]
topics: [frank-wolfe]
arxiv: "2604.28006"
note: >-
  The Lean formalization accompanying the NeurIPS 2026 paper by @pokutta2026frank, based on
  Christoph Spiegel's streamlined version of its original Lean development.
abstract: >-
  Frank–Wolfe converges at the rate $O(1/t)$, and in general no better. If a compact convex
  feasible region, together with its linear minimization oracle, satisfies local dual sharpness
  around the minimizer set, then Frank–Wolfe with short steps, exact line search or the
  open-loop step sizes $2/(t+2)$ converges with primal gap $o(1/t)$ for every smooth convex
  objective. Uniformly convex regions satisfy the condition everywhere, and regions that are
  curved only near the minimizers can satisfy it too. With a local Hölder error bound of order
  $r$ and sharpness exponent $q$, the gap is $O(t^{-rq/(rq-2)})$. The formal statements hold in
  real Hilbert spaces and for every oracle and every line-search rule.
