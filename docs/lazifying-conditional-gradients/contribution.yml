schema_version: 1
id: lazifying-conditional-gradients
lean_namespace: Lemmata.LazyCG
subject: math.OC
cross_lists: [cs.LG]
topics: [frank-wolfe]
arxiv: "1610.05120"
abstract: >-
  Lazy conditional gradient algorithms replace the linear optimization oracle of the Frank–Wolfe
  algorithm by a weak separation oracle, which only has to return a point that improves the linear
  objective by a fraction $\Phi/K$ of a target value, or certify that no point improves it by more
  than $\Phi$. Such an oracle can be built from a linear optimization oracle with a cache. With a
  convex objective of curvature $C$, the lazy conditional gradient algorithm converges at the rate
  $2\max\{C, \Phi_0\}(K^2 + 1)/(t + K^2 + 2)$, and its parameter-free variant, which halves $\Phi$
  after every negative answer, reaches primal gap $\varepsilon$ within
  $\lceil \log_2(\Phi_0/\varepsilon) \rceil + 1 + 4K\lceil \log_2(\Phi_0/(KC)) \rceil +
  16K^2C/\varepsilon$ iterations, at most $\lceil \log_2(\Phi_0/\varepsilon) \rceil + 1$ of
  them with a negative answer. The statements hold in real normed spaces, for every behaviour of
  the oracle.
