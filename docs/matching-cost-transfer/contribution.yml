schema_version: 1
id: matching-cost-transfer
lean_namespace: Lemmata.MatchingCostTransfer
category: optimization
abstract: >-
  Positive baseline costs can preserve the nonnegative rank of a shifted
  matching matrix. We prove the exact scaling identity, a transfer with one
  additional factor when the baseline-to-penalty ratio is uniformly bounded,
  and the metric properties of the associated two-cluster costs. Source
  nonnegative-rank lower bounds remain explicit hypotheses.
ai_use: >-
  The Lean formalization and exposition were developed with OpenAI Codex.
  The source lower bounds and the combinatorial instantiations are stated
  separately from the formalized matrix reductions.
