abstract: >-
  We refine Khoruzhii's integral crossing construction by restricting both alphabets to exact energy levels. If the levels of energies $H$ and $E$ contain at least $n$ and $m$ states, respectively, each crossing cut needs at most $Q(H+E)$ rank coordinates, where $Q$ counts all states at or below the energy cutoff. This gives a complex bilinear sum-of-squares identity with at most $4Q(H+E)$ squares. We also prove a balanced composition theorem with one rank index per distinct transversal cut, and discuss quantitative consequences of the classical partition asymptotic.
ai_use: >-
  The mathematical arguments, Lean formalization, exposition and finite comparisons were developed with OpenAI Codex.
