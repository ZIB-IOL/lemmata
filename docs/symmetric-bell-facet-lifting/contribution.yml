schema_version: 1
id: symmetric-bell-facet-lifting
lean_namespace: Lemmata.SymmetricBellFacetLifting
subject: quant-ph
cross_lists: [math.OC, math.CO]
topics: [bell-inequalities]
abstract: >-
  In the three-party, four-setting full-correlation Bell polytope, a facet of
  the Designolle–Vértesi–Pokutta symmetry projection lifts to a face strictly
  inside another proper exposed face. We give a two-coordinate reconstruction
  of the projection, prove the three-party cross-polytope equivalence for two
  through five settings, and give finite certificates and estimates for
  detecting and recovering frequency cross-polytopes.
contributors:
