<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lemmata">
  <!-- An L drawn twice: a written stroke (the prose) and a ruled one (the Lean proof),
       closed by the end-of-proof square. -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#2c3a5c"/>
  <path d="M20 14 C 19 26, 21 38, 19 48" fill="none" stroke="#f4efe6" stroke-width="5" stroke-linecap="round"/>
  <path d="M19 48 H 37" fill="none" stroke="#7fb3ff" stroke-width="5" stroke-linecap="square"/>
  <rect x="41" y="40" width="9" height="9" fill="#7fb3ff"/>
</svg>
