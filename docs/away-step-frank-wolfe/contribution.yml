arxiv: "2211.14103"
abstract: >-
  Linear convergence of the away-step and fully-corrective Frank–Wolfe algorithms over polytopes,
  following Sections 2.2.5 and 2.2.6 of the book Conditional Gradient Methods. For a polytope
  $P = \operatorname{conv} V$, the pyramidal width is the largest $\delta$ such that the away vertex
  $a$ and the Frank–Wolfe vertex $v$ of any direction $\psi$ satisfy
  $\psi(a - v) \ge \delta\, \psi(x - y)/\|x - y\|$; it has this scaling property itself. For a
  $\mu$-strongly convex objective the scaling property gives
  $f(x) - f(x^*) \le f'(x)(a - v)^2/(2\mu\delta^2)$. Every run of away-step Frank–Wolfe with short
  steps then satisfies $f(x_t) - f(x^*) \le (1 - \min\{1/2, \mu\delta^2/(4LD^2)\})^{\lfloor (t-1)/2
  \rfloor} LD^2/2$, and every run of fully-corrective Frank–Wolfe satisfies
  $f(x_t) - f(x^*) \le (1 - \min\{1/2, \mu\delta^2/(LD^2)\})^{t-1} LD^2/2$. The statements hold in
  real normed spaces, for every tie-breaking of the oracles.
