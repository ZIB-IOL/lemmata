abstract: >-
  We construct Steiner systems $S(2,6,n)$ for 24 of the 27 previously unresolved orders. Combined with known results, this shows that an $S(2,6,n)$ exists for $n\ge6$ if and only if $n\equiv1,6\pmod{15}$ and $n\notin\{16,21,36,46\}$, except possibly for $n\in\{51,61,81\}$, which remain open.
