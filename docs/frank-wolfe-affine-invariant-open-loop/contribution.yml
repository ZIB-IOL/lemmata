schema_version: 1
id: frank-wolfe-affine-invariant-open-loop
lean_namespace: Lemmata.FWAffineOpenLoop
subject: math.OC
cross_lists: [cs.LG]
topics: [frank-wolfe]
arxiv: "2310.04096"
note: >-
  Formalizes Sections 3 to 5 of @wirth2023accelerated and its sufficient conditions for the
  growth properties.
abstract: >-
  Affine-invariant convergence rates for the Frank–Wolfe algorithm with open-loop step sizes
  $\eta_t = \ell/(t + \ell)$, stated with the Bregman divergence along the Frank–Wolfe segment, the
  Frank–Wolfe gap and the best duality gap. Under the strong $(M, r)$-growth property, which bounds
  the Bregman divergence by $M\eta^2/2$ times the $r$-th power of the Frank–Wolfe gap, the best
  duality gap and the smallest Frank–Wolfe gap converge at the rate $O(1/t)$ for $r = 0$,
  $O(t^{-\ell})$ for $r = 1$, and $O(t^{-\ell+\varepsilon} + t^{-1/(1-r)})$ for $r \in [0, 1)$. Under
  the weaker weak growth and (relaxed) gaps growth properties, the primal gap converges at rates up
  to $O(t^{-2})$. Smoothness, uniformly convex feasible regions, Hölderian error bounds and
  minimizers in the relative interior imply the growth properties. The statements hold in real
  normed spaces, for every Frank–Wolfe run.
