abstract: >-
  For the Fishburn–Reeds matrix of order $d(d-1)$ we prove that the exact
  classical value is $2d(d-1)(2d-3)$. This establishes the conjectured
  vector-to-classical ratio $(3d-5)/(2d-3)$ in every dimension $d\ge 2$.
  The proof determines the maximum number of disagreements in an optimal
  sign strategy. We also evaluate the zero-diagonal family: the standard
  shift is strictly suboptimal for every $d\ge7$. Two explicit sign
  strategies and an integer upper certificate determine the global optimal
  uniform shifts in dimensions seven through ten.
ai_use: >-
  The exposition and Lean formalization were developed with OpenAI Codex.
  Codex also assisted with the mathematical arguments, literature search,
  certificate generation and verification. The entry distinguishes the scope
  of the Lean declarations from the mathematical proofs and the independently
  replayable integer computations.
