schema_version: 1
id: lp-hardness-in-p
lean_namespace: Lemmata.LPHardnessInP
category: optimization
abstract: >-
  We give concrete reductions from shifted matching matrices to approximate
  LP formulations for four polynomial-time solvable problems: metric
  minimum-cost perfect matching, minimum-cost T-join, minimum odd cut,
  and minimum-cost odd-red bipartite perfect matching. The first three
  yield exponential lower bounds for every fixed approximation factor
  from the Braun--Pokutta matching bound. The fourth uses a separate
  shifted parity-matching rank bound. Lean proves the combinatorial
  constructions, optimum identities, and transfers to formulation size;
  source rank bounds and affine Farkas certificates are explicit inputs.
ai_use: >-
  The exposition and Lean formalization were developed with OpenAI Codex.
  Source rank lower bounds and the existence of affine Farkas certificates
  are external to the formalization; no custom axioms are introduced.
