schema_version: 1
id: lp-hardness-in-p
lean_namespace: Lemmata.LPHardnessInP
category: optimization
abstract: >-
  We give concrete reductions from shifted matching matrices to approximate
  LP formulations for four polynomial-time solvable problems: metric
  minimum-cost perfect matching, minimum-cost T-join, minimum odd cut,
  and minimum-cost odd-red bipartite perfect matching. The first three
  yield exponential lower bounds for every fixed approximation factor
  from the shifted matching-matrix rank theorem of Braun and Pokutta.
  For parity matching, Lean also proves the new charging argument and
  finite shifted-rank bound from explicit partition and entropy hypotheses
  of Jia, Svensson, and Yuan. The concrete constructions, optimum identities,
  and transfers to formulation size are formalized; the earlier source
  theorems and the existence of affine Farkas certificates remain external.
ai_use: >-
  The exposition and Lean formalization were developed with OpenAI Codex.
  The published matching rank theorem, the earlier parity partition and
  entropy assertions, and affine Farkas certificate existence remain
  external. The new parity extension is formalized conditionally on precise
  hypotheses; no custom axioms are introduced.
acknowledgements: >-
  Research reported in this paper was partially supported by the Berlin Mathematics
  Research Center MATH$^+$ (EXC-2046/2, project ID 390685689), funded by the Deutsche
  Forschungsgemeinschaft (DFG, German Research Foundation) under Germany's Excellence
  Strategy. This work has been partially supported by OpenAI's Academic Researchers
  program.
