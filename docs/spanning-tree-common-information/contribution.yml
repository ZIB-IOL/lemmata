schema_version: 1
id: spanning-tree-common-information
lean_namespace: Lemmata.SpanningTreeCommonInformation
category: extended-formulations
tags: [optimization]
abstract: >-
  For the full canonical spanning-tree slack matrix of the complete graph on
  $n\ge3$ vertices, common information is at most $2\log_2 n+2$ bits;
  consequently its exponentiated nonnegative-rank lower-bound quantity is at
  most $4n^2$. The same bound holds for the subtour-only matrix. The proof uses
  a generic entropy bound for unit Boolean factorizations, the published
  min-split factors, and exact per-tree column masses; no tree-enumeration
  formula is needed. This limits the common-information method on these
  matrices, not their extension complexity.
