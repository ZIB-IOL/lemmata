schema_version: 1
id: c19-isotropic-symbol
lean_namespace: Lemmata.C19IsotropicSymbol
subject: math-ph
abstract: >-
  For the positive half of the three-dimensional C19 stencil with face weight
  two and edge weight one, the quadratic moment is exactly isotropic with
  coefficient 12. The finite-spacing cosine symbol differs from that
  quadratic approximation by an explicit fourth-order bound.
