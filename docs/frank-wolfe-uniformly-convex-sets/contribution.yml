id: frank-wolfe-uniformly-convex-sets
lean_namespace: Lemmata.FWUniformlyConvex
subject: math.OC
cross_lists: [cs.LG]
topics: [frank-wolfe]
arxiv: "2004.11053"
note: >-
  Formalizes Lemmas 2.4 and 2.9, Corollary 2.8 and Theorem 2.10 of @kerdreux2020projection.
abstract: >-
  Over uniformly convex feasible regions, the Frank–Wolfe algorithm converges faster than at the
  rate $O(1/t)$. The local scaling inequality
  $\frac{\alpha}{2}\|\nabla f(x^\star)\| \|x^\star - x\|^q \le
  \langle \nabla f(x^\star), x - x^\star \rangle$
  at a minimizer $x^\star$ follows from local uniform convexity at $x^\star$, or from a uniformly
  convex superset whose normal cone at $x^\star$ contains $-\nabla f(x^\star)$. Under a
  $(\mu, \theta)$-Hölderian error bound, the scaling inequality of $(\alpha, q)$-uniformly convex
  sets gives $(\alpha/\mu)\|x - v\|^q h^{1-\theta} \le g$ for the primal gap $h$ and the
  Frank–Wolfe gap $g$, and Frank–Wolfe with short steps converges at the rate
  $O(t^{-1/(1-2\theta/q)})$. The statements hold in real normed spaces.
