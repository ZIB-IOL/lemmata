topics: [lattice-operators]
abstract: >-
  Eight complex amplitudes on the corners of a cube carry three signed
  incidence maps and an even/odd parity grading. At the continuum
  normalization selected by the C19 stencil's second moment, the resulting
  first-order cubical symbol squares exactly to the isotropic massive
  quadratic C19 continuum symbol.
