# Authoring configuration. Contributors never edit the TOC: tools/lemmata.mjs prepare
# writes docs/myst.runtime.yml (git-ignored) with a TOC generated from the manifests,
# and the build uses that file.
version: 1
project:
  id: lemmata
  title: Lemmata
  description: A living archive of mathematics, each result written for people and checked by Lean.
  bibliography:
    - references.bib
  error_rules:
    - rule: reference-target-resolves
      severity: error
    - rule: identifier-is-unique
      severity: error
    # A link MyST cannot resolve is emitted as raw text and 404s in the browser. Found
    # 2026-10-19: the catalog's links were relative to the included file, not to index.md.
    - rule: link-resolves
      severity: error
  numbering:
    headings: false
site:
  template: book-theme
  title: Lemmata
  options:
    folders: true
    logo_text: Lemmata
    favicon: _static/favicon.svg
