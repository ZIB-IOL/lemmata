# Authoring configuration. Contributors never edit the TOC: tools/lemmata.mjs prepare
# writes docs/myst.runtime.yml (git-ignored) with a TOC generated from the manifests,
# and the build uses that file.
version: 1
project:
  id: lemmata
  title: Lemmata Repository
  description: A living archive of mathematics, each result written for people and checked by Lean.
  bibliography:
    - references.bib
  error_rules:
    - rule: reference-target-resolves
      severity: error
    - rule: identifier-is-unique
      severity: error
    # A link MyST cannot resolve is emitted as raw text and 404s in the browser. Found
    # 2026-10-19: the catalog's links were relative to the included file, not to index.md.
    - rule: link-resolves
      severity: error
  # Section numbers on entry pages (and in the right-hand contents); the site's own pages
  # (start page, About, ...) switch them off in their frontmatter.
  numbering:
    headings: true
site:
  template: book-theme
  # Replaces the theme's sidebar footer ("Made with MyST"), so it carries that line too.
  parts:
    primary_sidebar_footer: _static/sidebar-footer.md
  title: Lemmata Repository
  options:
    folders: true
    logo: _static/logo.svg
    logo_dark: _static/logo-dark.svg
    logo_alt: Lemmata Repository
    logo_text: Lemmata Repository
    # The stable address, not the release root: a page links within its own release, so the
    # logo would otherwise lead back into the release the page was built in.
    logo_url: /
    favicon: _static/favicon.svg
    style: _static/lemmata.css
