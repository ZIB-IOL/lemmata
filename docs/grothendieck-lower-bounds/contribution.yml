schema_version: 1
id: grothendieck-lower-bounds
lean_namespace: Lemmata.GrothendieckLowerBounds
subject: math.OC
cross_lists: [math.FA, quant-ph]
topics: [bell-inequalities]
abstract: >-
  An explicit $81\times321$ integer matrix with classical value $320975296$ and rational
  vectors in $\mathbb R^3$ give $K_G(3)>1.43888070193021$. Lean checks the vectors and their
  value and proves the passage to unit vectors; the classical value of the explicit matrix
  is the theorem's single hypothesis, established by an exhaustive integer search. New
  vectors for the $80\times269$ matrix of Márton et al. give $K_G(5),K_G(6)>1.49936483533988$
  with the classical value computed there.
contributors:
  - {name: Sebastian Pokutta, orcid: 0000-0001-7365-3000}
ai_use: >-
  The literature search, matrix optimization, certificate implementations, exposition and
  Lean formalization were developed with OpenAI Codex. Claude Opus 5.5 (Anthropic)
  formalized the checks of the vectors and the passage to unit vectors in Lean, and was used
  for review, consistency edits and independent replays of the certificates.
