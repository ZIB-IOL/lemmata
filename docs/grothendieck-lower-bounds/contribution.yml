schema_version: 1
id: grothendieck-lower-bounds
lean_namespace: Lemmata.GrothendieckLowerBounds
subject: math.OC
cross_lists: [math.FA, quant-ph]
topics: [bell-inequalities]
abstract: >-
  An explicit $301\times321$ integer matrix gives $K_G(3)>1.4397098471655953$.
  Averaging rotations of the published 406-direction local model of Designolle et al.
  gives $K_G(3)<1.451263576$. The rotation argument uses the published finite-model
  result and exact rational bounds. Lean checks the lower witness vectors and their
  objective and proves the uniform numerical upper estimate from the model and geometric
  hypotheses. Transposing an exhaustive sign list certifies the classical value of
  the 301-row matrix. New vectors
  on the matrix of Márton et al. give $K_G(5),K_G(6)>1.49936483533988$.
contributors:
  - {name: Sebastian Pokutta, orcid: 0000-0001-7365-3000}
ai_use: >-
  The literature search, matrix optimization, certificate implementations, exposition and
  Lean formalization were developed with OpenAI Codex. Claude Opus 5.5 (Anthropic)
  formalized the checks of the vectors and the passage to unit vectors in Lean, and was used
  for review, consistency edits and independent replays of the certificates. OpenAI Codex
  developed the 141-row extension, its numerical checks and Lean update, and the rotation
  argument and arithmetic checker for the global upper bound. For the 301-row extension,
  OpenAI Codex developed the search, integer certificates, independent replays and Lean proofs.
acknowledgements: >-
  Research reported in this paper was partially supported by the Berlin Mathematics
  Research Center MATH$^+$ (EXC-2046/2, project ID 390685689), funded by the Deutsche
  Forschungsgemeinschaft (DFG, German Research Foundation) under Germany's Excellence
  Strategy. This work has been partially supported by OpenAI's Academic Researchers
  program.
