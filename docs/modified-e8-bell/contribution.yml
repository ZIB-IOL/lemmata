topics: [bell-inequalities]
abstract: >-
  The $120\times120$ modified $E_8$ Bell matrix has classical value exactly
  $6104$. A symmetry reduction and a complete enumeration of $38\,549$
  chamber points prove the upper bound, and explicit signs attain it.
  Its eight-dimensional vector value is $9240$, giving the ratio $165/109$.
  An explicit finite mixture proves that the exact local visibility of the
  fixed root correlations is $109/165$.
