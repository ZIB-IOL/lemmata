schema_version: 1
id: common-information-hsb
lean_namespace: Lemmata.CommonInformationHsb
category: extended-formulations
tags: [optimization]
abstract: >-
  Common information and the logarithm of the max-entry-normalized hyperplane
  separation bound are not polynomially comparable on finite nonnegative matrices.
  Two explicit families have exact values: a half-heavy diagonal has HSB equal
  to two and unbounded common information, while one large all-ones block with
  singleton blocks has arbitrarily large logarithmic HSB and arbitrarily small
  common information. The formalization uses all finite product mixtures and
  signed witnesses constrained on every rectangle.
contributors:
