arxiv: "1810.02429"
note: >-
  Formalizes Lemmas 2.3 and 3.6 and Theorem 7.3 of @kerdreux2018restarting.
abstract: >-
  Hölderian error bounds interpolate between plain convexity and strong convexity, and with them
  the convergence of Frank–Wolfe algorithms between the rate $O(1/t)$ and linear convergence. The
  strong Wolfe gap of an iterate with active set $S$, the sum of its away gap and its Frank–Wolfe
  gap, bounds the primal gap and vanishes exactly at the minimizers. Under a $(\theta, c)$-Hölderian
  error bound over a polytope with pyramidal width $\delta$, the primal gap is at most
  $(c/\delta)^{1/(1-\theta)}$ times the strong Wolfe gap to the power $1/(1-\theta)$. Over strongly
  convex sets, vanilla Frank–Wolfe with short steps converges at the rate $O(t^{-1/(1-\theta)})$.
  The statements hold in real normed spaces.
